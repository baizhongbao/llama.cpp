name: fa-all-quants-cuda-windows

on:
  push:
    branches: [ fa-build2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: fa-build2
          fetch-depth: 1

      - name: Install Cuda Toolkit 13.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: 13.4
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja

      - name: Build ggml-cuda SM120 + FA_ALL_QUANTS
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU=OFF -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DLLAMA_BUILD_BORINGSSL=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target ggml-cuda

      - name: Upload ggml-cuda.dll + cudart13
        uses: actions/upload-artifact@v6
        with:
          name: llama-cuda13-faallquants-sm120
          path: |
            build/bin/Release/ggml-cuda.dll
            build/bin/Release/*.dll